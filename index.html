<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlatAzul - Con el vuelo de los pájaros</title>
  <!-- Iconos de FontAwesome para las redes sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reseteo básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e0e0e0;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Textura metálica/plateada cepillada */
    .metallic-bg {
      background: linear-gradient(180deg, #b0b5ba 0%, #d8dcde 25%, #8e9399 50%, #d8dcde 75%, #a0a5aa 100%);
      border-bottom: 2px solid #666;
      border-top: 2px solid #666;
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), inset 0 -1px 3px rgba(0,0,0,0.5);
    }

    /* ENCABEZADO */
    header {
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-title {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .brand-plat {
      color: #4a4d50;
    }

    .brand-azul {
      color: #006699;
      text-shadow: 0px 1px 2px rgba(0,0,0,0.3);
    }

    .logo-img {
      height: 70px;
      width: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #006699;
    }

    /* CONTENIDO PRINCIPAL */
    main {
      background-color: #ffffff;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 5%;
    }

    .book-container {
      max-width: 900px;
      width: 100%;
      display: flex;
      gap: 50px;
      align-items: flex-start;
    }

    .book-cover {
      flex: 1;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    .book-cover img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .book-details {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 2.2rem;
      color: #000;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .book-genre {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 25px;
    }

    .synopsis-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .synopsis-text {
      color: #444;
      line-height: 1.6;
      margin-bottom: 35px;
      font-size: 1rem;
    }

    /* BOTONES ESTILO METÁLICO/AZUL */
    .download-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 280px;
    }

    .btn-metallic {
      display: block;
      padding: 12px 20px;
      text-align: center;
      text-decoration: none;
      color: #000;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      border-radius: 20px;
      background: linear-gradient(180deg, #d6d9dc 0%, #8b929a 50%, #5a6068 51%, #a2a8b0 100%);
      border: 1px solid #444;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-metallic:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* PIE DE PÁGINA */
    footer {
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .footer-center {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .social-icons {
      display: flex;
      gap: 15px;
    }

    .social-icons a {
      color: #222;
      font-size: 1.4rem;
      transition: color 0.3s;
    }

    .social-icons a:hover {
      color: #006699;
    }

    /* Adaptación para pantallas pequeñas */
    @media (max-width: 768px) {
      .book-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .download-buttons {
        margin: 0 auto;
      }
      header, footer {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con textura metálica -->
  <header class="metallic-bg">
    <div class="brand-container">
      <h1 class="brand-title">
        <span class="brand-plat">Plat</span><span class="brand-azul">Azul</span>
      </h1>
      <!-- Imagen de logo colocada a la derecha de PlatAzul -->
      <img src="logo-101.jpg" alt="Logo PlatAzul" class="logo-img">
    </div>
    <nav>
      <a href="#contacto">CONTACTO</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="book-container">
      <!-- Portada del libro -->
      <div class="book-cover">
        <img src="portada-libro.jpg" alt="Con el vuelo de los pájaros">
      </div>

      <!-- Detalle del libro y descargas -->
      <div class="book-details">
        <h2 class="book-title">Con el vuelo de los pájaros</h2>
        <p class="book-genre">Science Fiction</p>

        <h3 class="synopsis-title">Sinopsis</h3>
        <p class="synopsis-text">
          [Próximamente ingresarás aquí la sinopsis de la novela...]
        </p>

        <div class="download-buttons">
          <a href="#" class="btn-metallic">DESCARGAR PDF</a>
          <a href="#" class="btn-metallic">DESCARGAR ePub</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Pie de página con textura metálica -->
  <footer class="metallic-bg">
    <div class="footer-left">
      <span class="brand-plat">Plat</span><span class="brand-azul">Azul</span>
    </div>
    <div class="footer-center">
      <span class="brand-plat">Plat</span><span class="brand-azul">Azul</span>
    </div>
    <div class="social-icons" id="contacto">
      <a href="#"><i class="fa-regular fa-envelope"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>

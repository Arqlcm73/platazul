<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlatAzul - Con el vuelo de los pájaros</title>
  <!-- Iconos de redes sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BANDA METÁLICA MÁS OSCURA, OPACA Y CON ESMERILADO MUY VISIBLE */
    .metallic-bar {
      background-color: #53585e;
      background-image: 
        /* Rayado horizontal pronunciado para efecto esmerilado/cepillado */
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.28) 0px,
          rgba(255, 255, 255, 0.28) 1px,
          rgba(0, 0, 0, 0.35) 1px,
          rgba(0, 0, 0, 0.35) 2px
        ),
        /* Gradiente metálico oscuro y opaco */
        linear-gradient(
          180deg, 
          #2c3035 0%, 
          #585e66 18%, 
          #8a9098 42%, 
          #a8aeb7 50%, 
          #717780 62%, 
          #41454b 85%, 
          #202327 100%
        );
      background-blend-mode: overlay;
      border-top: 1px solid #1a1c1f;
      border-bottom: 2px solid #101113;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.7);
    }

    /* ENCABEZADO SUPERIOR */
    header {
      padding: 34px 5%; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    /* MARCO 3D METÁLICO PARA EL LOGO (logo-101.jpg) */
    .logo-frame {
      width: 105px;
      height: 105px;
      border-radius: 16px;
      background: linear-gradient(135deg, #d2d5d9 0%, #4a4f56 50%, #121416 100%);
      padding: 4px;
      box-shadow: 
        0 8px 16px rgba(0, 0, 0, 0.6), 
        inset 0 2px 3px rgba(255, 255, 255, 0.8), 
        inset 0 -3px 5px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #0d0e10;
    }

    /* TÍTULO PRINCIPAL: PlatAzul con transición gradual Silver -> Blue */
    .brand-title {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 4.8rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      display: inline-block;
      
      /* Gradiente continuo desde Plata (P) hasta Azul metalizado (A en adelante) */
      background: linear-gradient(
        90deg, 
        #a6acb3 0%,    /* P plateada */
        #828890 25%,   /* Transición suave plateada */
        #49719b 48%,   /* Mezcla intermedia antes de la A */
        #0066b2 62%,   /* Azul en la A */
        #004488 100%   /* Azul metalizado profundo final */
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.7));
    }

    /* ENLACE DE CONTACTO */
    nav a {
      font-family: Arial, sans-serif;
      color: #e2e5e9;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      transition: color 0.2s;
    }

    nav a:hover {
      color: #3399ff;
    }

    /* ÁREA CENTRAL BLANCA */
    main {
      background-color: #ffffff;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 5%;
    }

    .book-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }

    .book-cover-container {
      flex: 0 0 320px;
    }

    .book-cover-container img {
      width: 100%;
      height: auto;
      border-radius: 3px;
      box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.25);
    }

    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .book-category {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 28px;
    }

    .synopsis-heading {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    .synopsis-body {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* BOTONES DE DESCARGA CON TEXTURA METÁLICA Y REMACHES */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 310px;
    }

    .btn-download {
      display: block;
      padding: 14px 20px;
      text-align: center;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 -1px 2px rgba(0, 0, 0, 0.9);
      border-radius: 6px;
      background-color: #0066aa;
      background-image: 
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18) 0px,
          rgba(255, 255, 255, 0.18) 1px,
          rgba(0, 0, 0, 0.15) 1px,
          rgba(0, 0, 0, 0.15) 2px
        ),
        linear-gradient(
          180deg, 
          #5ea6d8 0%, 
          #0066aa 18%, 
          #004b85 50%, 
          #002b55 51%, 
          #005588 85%, 
          #2283cc 100%
        );
      background-blend-mode: overlay;
      border: 1px solid #121417;
      box-shadow: 
        0 5px 10px rgba(0, 0, 0, 0.45), 
        inset 0 1px 2px rgba(255, 255, 255, 0.8), 
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
      position: relative;
      transition: transform 0.1s, filter 0.2s;
    }

    .btn-download::before, .btn-download::after {
      content: '';
      position: absolute;
      top: 7px;
      width: 5px;
      height: 5px;
      background: #eef1f5;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .btn-download::before { left: 8px; }
    .btn-download::after { right: 8px; }

    .btn-download:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    /* PIE DE PÁGINA */
    footer {
      padding: 28px 5%; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-brand {
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(
        90deg, 
        #a6acb3 0%, 
        #49719b 50%, 
        #0066b2 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.8));
    }

    .footer-icons {
      display: flex;
      gap: 20px;
    }

    .footer-icons a {
      color: #e2e5e9;
      font-size: 1.4rem;
      text-decoration: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      transition: color 0.2s;
    }

    .footer-icons a:hover {
      color: #3399ff;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
      .book-wrapper {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .buttons-container {
        margin: 0 auto;
      }
      footer {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado superior con bandas oscuras, esmerilado visible y gradiente continuo -->
  <header class="metallic-bar">
    <div class="header-brand">
      <div class="logo-frame">
        <img src="logo-101.jpg" alt="Logo PlatAzul">
      </div>
      <h1 class="brand-title">PlatAzul</h1>
    </div>
    <nav>
      <a href="#contacto">CONTACTO</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <div class="book-wrapper">
      <div class="book-cover-container">
        <img src="portada-libro.jpg" alt="Portada Con el vuelo de los pájaros">
      </div>

      <div class="book-info">
        <h2 class="book-title">Con el vuelo de los pájaros</h2>
        <p class="book-category">Science Fiction</p>

        <h3 class="synopsis-heading">Sinopsis</h3>
        <p class="synopsis-body">
          [Próximamente ingresarás aquí la sinopsis de la novela...]
        </p>

        <div class="buttons-container">
          <a href="libro.pdf" download class="btn-download">DESCARGAR PDF</a>
          <a href="libro.epub" download class="btn-download">DESCARGAR ePub</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="metallic-bar">
    <div class="footer-brand">PlatAzul</div>
    <div class="footer-brand">PlatAzul</div>
    <div class="footer-icons" id="contacto">
      <a href="mailto:tuemail@ejemplo.com"><i class="fa-regular fa-envelope"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>

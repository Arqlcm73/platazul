<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlatAzul - Con el vuelo de los pájaros</title>
  <!-- Iconos de redes sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BANDA METÁLICA ESMERILADA (Estilo exacto de placa cepillada) */
    .metallic-bar {
      background: linear-gradient(
        180deg, 
        #93989e 0%, 
        #c2c6cc 18%, 
        #eef1f5 45%, 
        #eef1f5 55%, 
        #b2b6bc 82%, 
        #797d83 100%
      );
      border-top: 1px solid #5a5e64;
      border-bottom: 2px solid #42454a;
    }

    /* ENCABEZADO SUPERIOR */
    header {
      padding: 30px 4%; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    /* MARCO 3D METÁLICO PARA EL LOGO (Más grande) */
    .logo-frame {
      width: 95px;
      height: 95px;
      border-radius: 14px;
      background: linear-gradient(135deg, #d8dadf 0%, #686d75 50%, #22252a 100%);
      padding: 4px;
      box-shadow: 
        0 6px 14px rgba(0, 0, 0, 0.45), 
        inset 0 2px 3px rgba(255, 255, 255, 0.9), 
        inset 0 -2px 4px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #1a1c20;
    }

    /* TÍTULO PRINCIPAL: PlatAzul */
    .brand-title {
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .plat-text {
      color: #4a4f56;
      text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.8), 0 -1px 1px rgba(0, 0, 0, 0.3);
    }

    .azul-text {
      background: linear-gradient(180deg, #3399ff 0%, #0066cc 50%, #003366 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.35));
    }

    /* ENLACE DE CONTACTO */
    nav a {
      color: #2c3036;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
      transition: color 0.2s;
    }

    nav a:hover {
      color: #0066cc;
    }

    /* ÁREA CENTRAL BLANCA */
    main {
      background-color: #ffffff;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 4%;
    }

    .book-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }

    .book-cover-container {
      flex: 0 0 320px;
    }

    .book-cover-container img {
      width: 100%;
      height: auto;
      border-radius: 3px;
      box-shadow: 8px 12px 25px rgba(0, 0, 0, 0.25);
    }

    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .book-category {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 28px;
    }

    .synopsis-heading {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    .synopsis-body {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* BOTONES DE DESCARGA CON PLACA METÁLICA Y REMACHES */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 300px;
    }

    .btn-download {
      display: block;
      padding: 14px 20px;
      text-align: center;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 -1px 2px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      background: linear-gradient(
        180deg, 
        #6bb2df 0%, 
        #0066aa 15%, 
        #004d88 50%, 
        #002b55 51%, 
        #005588 85%, 
        #268bd2 100%
      );
      border: 1px solid #1a1c20;
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.35), 
        inset 0 1px 2px rgba(255, 255, 255, 0.7), 
        inset 0 -2px 3px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: transform 0.1s, filter 0.2s;
    }

    .btn-download::before, .btn-download::after {
      content: '';
      position: absolute;
      top: 6px;
      width: 5px;
      height: 5px;
      background: #eef1f5;
      border-radius: 50%;
      box-shadow: 0 1px 1px rgba(0,0,0,0.8);
    }
    .btn-download::before { left: 8px; }
    .btn-download::after { right: 8px; }

    .btn-download:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* PIE DE PÁGINA */
    footer {
      padding: 25px 4%; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left, .footer-center {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .footer-icons {
      display: flex;
      gap: 20px;
    }

    .footer-icons a {
      color: #2c3036;
      font-size: 1.4rem;
      text-decoration: none;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
      transition: color 0.2s;
    }

    .footer-icons a:hover {
      color: #0066cc;
    }

    /* DISEÑO RESPONSIVO */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
      .book-wrapper {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .buttons-container {
        margin: 0 auto;
      }
      footer {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado superior con esmerilado claro y logo grande -->
  <header class="metallic-bar">
    <div class="header-brand">
      <div class="logo-frame">
        <img src="logo-101.jpg" alt="Logo PlatAzul">
      </div>
      <h1 class="brand-title">
        <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
      </h1>
    </div>
    <nav>
      <a href="#contacto">CONTACTO</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <div class="book-wrapper">
      <div class="book-cover-container">
        <img src="portada-libro.jpg" alt="Portada Con el vuelo de los pájaros">
      </div>

      <div class="book-info">
        <h2 class="book-title">Con el vuelo de los pájaros</h2>
        <p class="book-category">Science Fiction</p>

        <h3 class="synopsis-heading">Sinopsis</h3>
        <p class="synopsis-body">
          [Próximamente ingresarás aquí la sinopsis de la novela...]
        </p>

        <div class="buttons-container">
          <a href="libro.pdf" download class="btn-download">DESCARGAR PDF</a>
          <a href="libro.epub" download class="btn-download">DESCARGAR ePub</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="metallic-bar">
    <div class="footer-left">
      <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
    </div>
    <div class="footer-center">
      <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
    </div>
    <div class="footer-icons" id="contacto">
      <a href="mailto:tuemail@ejemplo.com"><i class="fa-regular fa-envelope"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>

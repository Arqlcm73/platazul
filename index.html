<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlatAzul.com.ar - Con el vuelo de los pájaros</title>
  <!-- Iconos de redes sociales y acciones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Carga de fuentes caligráficas alternativas desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #fbf9f5; /* Crema muy apagado como fondo general */
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* BANDA METÁLICA MÁS OSCURA, OPACA Y CON ESMERILADO MUY VISIBLE */
    .metallic-bar {
      background-color: #53585e;
      background-image: 
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.28) 0px,
          rgba(255, 255, 255, 0.28) 1px,
          rgba(0, 0, 0, 0.35) 1px,
          rgba(0, 0, 0, 0.35) 2px
        ),
        linear-gradient(
          180deg, 
          #2c3035 0%, 
          #585e66 18%, 
          #8a9098 42%, 
          #a8aeb7 50%, 
          #717780 62%, 
          #41454b 85%, 
          #202327 100%
        );
      background-blend-mode: overlay;
      border-top: 1px solid #1a1c1f;
      border-bottom: 2px solid #101113;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.7);
    }
    /* FRANJAS DE TEXTO MUY PEQUEÑAS Y PEGADAS A LAS BANDAS */
    .ticker-stripe {
      background-color: #f2f4f7;
      color: #4a4e54;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 0;
      white-space: nowrap;
      overflow: hidden;
      width: 100%;
      letter-spacing: 0px;
      user-select: none;
      line-height: 1.1;
    }
    /* ENCABEZADO SUPERIOR */
    header {
      padding: 34px 5%; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    /* CONTENEDOR DEL LOGO CON © */
    .logo-container-relative {
      position: relative;
      display: flex;
      align-items: center;
    }
    /* MARCO 3D METÁLICO PARA EL LOGO (logo-101.jpg) */
    .logo-frame {
      width: 105px;
      height: 105px;
      border-radius: 16px;
      background: linear-gradient(135deg, #d2d5d9 0%, #4a4f56 50%, #121416 100%);
      padding: 4px;
      box-shadow: 
        0 8px 16px rgba(0, 0, 0, 0.6), 
        inset 0 2px 3px rgba(255, 255, 255, 0.8), 
        inset 0 -3px 5px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #0d0e10;
      image-rendering: -webkit-optimize-contrast;
    }
    /* SÍMBOLO © AL COSTADO DERECHO DEL LOGO */
    .logo-copyright-symbol {
      font-size: 1.1rem;
      font-weight: 700;
      color: #d0d5dd;
      margin-left: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      align-self: flex-start;
      margin-top: 8px;
    }
    /* TÍTULO PRINCIPAL: PlatAzul */
    .brand-title-wrapper {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .brand-title {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 4.8rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      display: inline-block;
      
      background: linear-gradient(
        90deg, 
        #ffffff 0%,    
        #dcdcdc 8%,   
        #7a8088 16%,   
        #ffffff 24%,   
        #c8d0d8 35%,   
        #507ca8 48%,   
        #003865 70%,   
        #001830 100%   
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.85));
    }
    /* EXTENSIÓN .com.ar */
    .domain-ext {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #a8b0b8 50%, #5f646a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.8));
      margin-left: 2px;
    }
    /* ENLACES DE NAVEGACIÓN SUPERIOR */
    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }
    nav a {
      font-family: Arial, sans-serif;
      color: #e2e5e9;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      transition: color 0.2s;
    }
    nav a:hover {
      color: #3399ff;
    }
    /* ÁREA CENTRAL CON CREMA MUY APAGADO */
    main {
      background-color: #fbf9f5;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 5%;
    }
    .book-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }
    .book-cover-container {
      flex: 0 0 320px;
    }
    .book-cover-container img {
      width: 100%;
      height: auto;
      border-radius: 3px;
      box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.25);
    }
    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    /* ESTILOS DEL TÍTULO DE LA NOVELA */
    .book-title {
      color: #000000;
      margin-bottom: 12px;
      white-space: nowrap; 
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 2px;
      max-width: 100%;
      overflow: visible;
      padding: 15px 0px 10px 0px;
      margin-left: -38px;
    }
    /* FUENTE EDWARDIAN SCRIPT ITC PARA INICIALES MAYÚSCULAS */
    .edwardian-cap-c {
      font-family: 'Edwardian Script ITC', 'Alex Brush', 'Great Vibes', cursive;
      font-size: 5.2rem;
      font-weight: bold;
      line-height: 1;
      margin-right: -4px;
      -webkit-text-stroke: 0.3px #000;
    }
    .edwardian-cap-vp {
      font-family: 'Edwardian Script ITC', 'Alex Brush', 'Great Vibes', cursive;
      font-size: 4.2rem;
      font-weight: bold;
      line-height: 1;
      margin-right: -3px;
      -webkit-text-stroke: 0.3px #000;
    }
    /* FUENTE EMBASSY BT / CALIGRÁFICA PARA RESTO DE LETRAS Y PUNTO */
    .embassy-text {
      font-family: 'Embassy BT', 'Parisienne', 'Alex Brush', cursive;
      font-size: 1.85rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      -webkit-text-stroke: 0.2px #000;
    }
    /* AUTORÍA Y SUBTÍTULO */
    .book-by {
      font-size: 0.85rem;
      color: #777;
      font-style: italic;
      margin-bottom: 2px;
    }
    .book-author {
      font-size: 1.15rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 8px;
    }
    .book-category {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.4;
      max-width: 500px;
    }
    /* BOTONES DE DESCARGA LISOS */
    .buttons-container {
      display: flex;
      flex-direction: column;

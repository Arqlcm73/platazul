<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlatAzul - Con el vuelo de los pájaros</title>
  <!-- Iconos de redes sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #dcdfe3; /* Fondo exterior similar a la pantalla */
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BANDA METÁLICA ESMERILADA CON PROPORCIÓN EXACTA */
    .metallic-bar {
      background: linear-gradient(
        180deg, 
        #3a3d42 0%, 
        #7c8187 8%, 
        #c8cbce 22%, 
        #9ea2a7 45%, 
        #5a5e64 65%, 
        #b2b6bb 88%, 
        #3e4145 100%
      );
      border-top: 3px solid #1f2124;
      border-bottom: 4px solid #15171a;
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.8), 
        inset 0 -3px 6px rgba(0, 0, 0, 0.7);
    }

    /* ENCABEZADO SUPERIOR */
    header {
      padding: 28px 4%; /* Altura generosa proporcional a logo-pa.jpg */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* MARCO 3D METÁLICO PARA EL LOGO (logo-101.jpg) */
    .logo-frame {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e6e8ea 0%, #83888e 50%, #3e4145 100%);
      padding: 3px;
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.5), 
        inset 0 2px 3px rgba(255, 255, 255, 0.9), 
        inset 0 -2px 4px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 7px;
      border: 1px solid #2a2c2e;
    }

    /* TÍTULO PRINCIPAL: PlatAzul */
    .brand-title {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .plat-text {
      color: #3b3e42;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6), -1px -1px 2px rgba(0, 0, 0, 0.5);
    }

    .azul-text {
      background: linear-gradient(180deg, #1e88e5 0%, #005b96 50%, #003366 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.4));
    }

    /* ENLACE DE NAVEGACIÓN */
    nav a {
      color: #2b2e33;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      transition: color 0.2s;
    }

    nav a:hover {
      color: #005b96;
    }

    /* ÁREA CENTRAL BLANCA */
    main {
      background-color: #ffffff;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 4%;
    }

    .book-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }

    .book-cover-container {
      flex: 0 0 320px;
    }

    .book-cover-container img {
      width: 100%;
      height: auto;
      border-radius: 2px;
      box-shadow: 8px 12px 24px rgba(0, 0, 0, 0.25);
    }

    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .book-category {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 28px;
    }

    .synopsis-heading {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    .synopsis-body {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* BOTONES DE DESCARGA EN AZUL METALIZADO Y PLATEADO */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 290px;
    }

    .btn-download {
      display: block;
      padding: 13px 20px;
      text-align: center;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-shadow: 0 -1px 2px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: linear-gradient(
        180deg, 
        #82b3d5 0%, 
        #006699 12%, 
        #004477 50%, 
        #002b55 51%, 
        #005588 88%, 
        #0088cc 100%
      );
      border: 2px solid #1a1c1e;
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.4), 
        inset 0 1px 2px rgba(255, 255, 255, 0.8), 
        inset 0 -2px 3px rgba(0, 0, 0, 0.6);
      transition: transform 0.1s, filter 0.2s;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* PIE DE PÁGINA CON LA MISMA PROPORCIÓN */
    footer {
      padding: 22px 4%; /* Altura proporcional a la parte superior */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-logo-left, .footer-logo-center {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .footer-icons {
      display: flex;
      gap: 18px;
    }

    .footer-icons a {
      color: #2b2e33;
      font-size: 1.4rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-icons a:hover {
      color: #005b96;
    }

    /* DISEÑO RESPONSIVO (MÓVILES) */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
      .book-wrapper {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .buttons-container {
        margin: 0 auto;
      }
      footer {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado superior con la proporción exacta -->
  <header class="metallic-bar">
    <div class="header-brand">
      <div class="logo-frame">
        <img src="logo-101.jpg" alt="Logo PlatAzul">
      </div>
      <h1 class="brand-title">
        <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
      </h1>
    </div>
    <nav>
      <a href="#contacto">CONTACTO</a>
    </nav>
  </header>

  <!-- Cuerpo central -->
  <main>
    <div class="book-wrapper">
      <div class="book-cover-container">
        <img src="portada-libro.jpg" alt="Portada Con el vuelo de los pájaros">
      </div>

      <div class="book-info">
        <h2 class="book-title">Con el vuelo de los pájaros</h2>
        <p class="book-category">Science Fiction</p>

        <h3 class="synopsis-heading">Sinopsis</h3>
        <p class="synopsis-body">
          [Próximamente ingresarás aquí la sinopsis de la novela...]
        </p>

        <div class="buttons-container">
          <a href="libro.pdf" download class="btn-download">DESCARGAR PDF</a>
          <a href="libro.epub" download class="btn-download">DESCARGAR ePub</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página con la misma proporción -->
  <footer class="metallic-bar">
    <div class="footer-logo-left">
      <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
    </div>
    <div class="footer-logo-center">
      <span class="plat-text">Plat</span><span class="azul-text">Azul</span>
    </div>
    <div class="footer-icons" id="contacto">
      <a href="mailto:tuemail@ejemplo.com"><i class="fa-regular fa-envelope"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>
